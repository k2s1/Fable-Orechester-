    <circle cx="88" cy="42" r="2"/>
    <circle cx="132" cy="42" r="2"/>
    <circle cx="176" cy="42" r="2"/>
    <circle cx="220" cy="42" r="2"/>
    <circle cx="264" cy="42" r="2"/>
    <circle cx="308" cy="42" r="2"/>
    <circle cx="352" cy="42" r="2"/>
    <circle cx="396" cy="42" r="2"/>
    <circle cx="440" cy="42" r="2"/>
    <circle cx="484" cy="42" r="2"/>
    <circle cx="528" cy="42" r="2"/>
    <circle cx="572" cy="42" r="2"/>
    <circle cx="616" cy="42" r="2"/>
    <circle cx="660" cy="42" r="2"/>
    <circle cx="704" cy="42" r="2"/>
    <circle cx="748" cy="42" r="2"/>
    <circle cx="792" cy="42" r="2"/>
    <circle cx="836" cy="42" r="2"/>
    <circle cx="880" cy="42" r="2"/>
    <circle cx="924" cy="42" r="2"/>
