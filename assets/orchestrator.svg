<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" role="img" aria-labelledby="title description">
  <title id="title">Fable 5.1 orchestration flow</title>
  <desc id="description">Fable 5.1 plans and adjudicates, routes implementation to GPT-5.6 Luna and DeepSeek V4 Flash, and receives verification evidence.</desc>

  <rect width="1200" height="600" fill="#09111f"/>

